<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Binder — trading card prices</title>
  <meta name="description" content="Daily price lookups for Magic, Pokémon, One Piece, Lorcana, and Riftbound, with the full reprint saga behind every card." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5470'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23fff6ea'>✦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    html { background: #fff6ea; }
    body { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; color: #241a45; background: #fff6ea; -webkit-font-smoothing: antialiased; }
    a { color: #5b3df5; } a:hover { color: #ff5470; }
    input { font-family: 'Bricolage Grotesque', sans-serif; }
    button { font-family: 'Bricolage Grotesque', sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    ::selection { background: #ffd6e0; }
    .lift-tile { transition: transform .15s ease, box-shadow .15s ease; }
    .lift-tile:hover { transform: translate(-2px, -3px); box-shadow: 7px 8px 0 #241a45 !important; }
    .lift-row { transition: transform .15s ease, box-shadow .15s ease; }
    .lift-row:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 #241a45 !important; }
    .lift-btn { transition: transform .12s ease; }
    .lift-btn:hover { transform: translateY(-2px); }
    .result-row:hover { background: #fff1dc; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
