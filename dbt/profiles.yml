# Local DuckDB over the committed Parquet partitions. Run from the repo
# root: dbt build --project-dir dbt --profiles-dir dbt
# (relative source paths resolve from the working directory, so always
# invoke from the repo root).
tcg_market:
  target: local
  outputs:
    local:
      type: duckdb
      path: dbt/tcg.duckdb
      threads: 4
    # Hosted warehouse mirror. Auth: motherduck_token env var (set from
    # the MOTHERDUCK_TOKEN secret in CI).
    md:
      type: duckdb
      path: "md:tcg_market"
      threads: 4
