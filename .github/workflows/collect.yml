name: daily-snapshot

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r collector/requirements.txt
      - name: Collect daily snapshot
        run: python -m collector.snapshot
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
      - name: Commit partitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "snapshot: $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

  # Bot pushes don't trigger push workflows, so the daily site refresh
  # rides on this workflow instead.
  deploy-site:
    needs: snapshot
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
    secrets: inherit

  alert-on-failure:
    needs: [snapshot, deploy-site]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is already open for today
        run: |
          title="Daily pipeline failed: $(date -u +%F)"
          if gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq length | grep -qv '^0$'; then
            echo "issue already open"
          else
            gh issue create --repo "$REPO" --title "$title" \
              --body "Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
