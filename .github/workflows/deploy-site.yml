name: deploy-site

# Builds the marts, exports site JSON, builds the React app, deploys to
# Vercel, and mirrors the marts to MotherDuck. Checks out latest main
# explicitly so the daily-snapshot caller deploys the partition it just
# committed (the workflow's trigger SHA predates that commit).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "dbt/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r dbt/requirements.txt
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - run: python scripts/export_site_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Deploy to Vercel
        run: npx vercel deploy dist --prod --yes --token "$VERCEL_TOKEN"
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Last on purpose: a MotherDuck hiccup should page us (red run)
      # without blocking the site deploy.
      - name: Mirror marts to MotherDuck
        run: |
          python -c "import duckdb; duckdb.connect('md:').execute('CREATE DATABASE IF NOT EXISTS tcg_market')"
          dbt build --project-dir dbt --profiles-dir dbt --target md
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
