name: deploy-site

# Builds the marts, exports site JSON, builds the React app, deploys to
# GitHub Pages. Checks out latest main explicitly so the daily-snapshot
# caller deploys the partition it just committed (the workflow's trigger
# SHA predates that commit).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "dbt/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r dbt/requirements.txt
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - run: python scripts/export_site_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
